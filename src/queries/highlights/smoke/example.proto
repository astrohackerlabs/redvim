// café: proto3 schema, never executed
syntax = "proto3";
package demo.api;
import public "other.proto";
option java_package = "demo.api";
message Request {
  reserved 7, 9 to 12;
  reserved "old_name";
  message Nested { string text = 1; }
  optional string name = 1;
  repeated .demo.api.Request.Nested entries = 2;
  map<string, int32> counts = 3;
  oneof choice { bytes data = 4; bool flag = 5; }
  enum State { UNKNOWN = 0; READY = 1; }
  State state = 6 [deprecated = true];
}
service Gateway {
  rpc Send(stream Request) returns (stream Request);
}
/* after the service */
message After { int64 value = 42; }
